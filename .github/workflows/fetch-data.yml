name: Fetch & Deploy Data

on:
  schedule:
    - cron: "0 */12 * * *"  # Every 12 hours (per user request)
  workflow_dispatch:        # Manual trigger
    inputs:
      force-extract:
        description: 'Fix empty ai_tiers (re-extract only empty-tiers projects with 20000 char limit)'
        required: false
        default: false
        type: boolean
      skip-api-fetch:
        description: 'Skip API fetch + merge. Only fetch missing HTML + AI extract + translate (faster, saves credits)'
        required: false
        default: false
        type: boolean
      backfill-description:
        description: 'Backfill missing ai_description_en only (lightweight mode, no full re-extract, ~4000 tokens each)'
        required: false
        default: false
        type: boolean
      description-limit:
        description: 'Max projects to backfill (empty = all; use a small number first to verify quality & RPM)'
        required: false
        default: ''
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      CONTEXT_DEV_API_KEY: ${{ secrets.CONTEXT_DEV_API_KEY }}
      TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
      MOUTER_API_KEY: ${{ secrets.MOUTER_API_KEY }}
      MOUTER_RPM: ${{ secrets.MOUTER_RPM || '3' }}
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests openai firecrawl-py context.dev

      - name: Fetch Kickstarter API
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip-api-fetch != 'true' }}
        continue-on-error: true
        run: python scripts/fetch-kickstarter.py

      - name: Refresh known KS variables (watchlist, zero-credit)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip-api-fetch != 'true' }}
        continue-on-error: true
        run: python scripts/fetch-kickstarter.py watchlist

      - name: Fetch Indiegogo API
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip-api-fetch != 'true' }}
        continue-on-error: true
        run: python scripts/fetch-indiegogo.py

      - name: Merge data + score + snapshot
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip-api-fetch != 'true' }}
        run: python scripts/merge.py

      - name: Commit merged data (persist before HTML/AI steps)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip-api-fetch != 'true' }}
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/projects.json
          if git diff --staged --quiet; then
            echo "No merge changes to commit"
          else
            git commit -m "data: merge + score [skip actions]"
            git push
          fi

      - name: Fetch HTML (new projects only)
        run: python scripts/fetch-html.py

      - name: Commit HTML progress (credit-costly — save immediately)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/projects.json scripts/raw/html/
          if git diff --staged --quiet; then
            echo "No HTML changes to commit"
          else
            git commit -m "data: save HTML snapshots [skip actions]"
            git push
          fi

      - name: AI extract fields
        run: |
          ARGS=""
          [ "${{ github.event.inputs.force-extract }}" = "true" ] && ARGS="$ARGS --only-empty-tiers"
          [ "${{ github.event.inputs.backfill-description }}" = "true" ] && ARGS="$ARGS --only-description"
          [ -n "${{ github.event.inputs.description-limit }}" ] && ARGS="$ARGS --limit ${{ github.event.inputs.description-limit }}"
          python scripts/ai-extract.py $ARGS

      - name: Commit AI-extracted fields (persist before validate/translate)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/projects.json
          if git diff --staged --quiet; then
            echo "No AI fields to commit"
          else
            git commit -m "data: AI-extracted fields [skip actions]"
            git push
          fi

      - name: Validate AI data
        run: python scripts/validate-ai-data.py

      # 翻译已拆出到独立 workflow (translate-only.yml)，使用 Mouter AI 独立引擎。
      # 英文抽取 (ai-extract) 也已迁到 Mouter 主用（见 scripts/ai-extract.py 的
      # LLM_PROVIDERS 顺序）：抽取与翻译都走 Mouter 独占额度，与 Cloudflare 免费
      # 10k neurons 彻底解耦，解决"新抓项目被额度饿死、缺 AI 字段"的历史问题。
      # Cloudflare / Agnes 仅作 Mouter 不可用时的兜底。

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/projects.json scripts/raw/html/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: auto-update projects.json [skip actions]"
            git push
          fi

      - name: Setup Node.js
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Build Astro site
        if: always()
        run: |
          npm ci
          npx astro build
